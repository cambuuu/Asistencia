# fly.toml app configuration file for discordasistenciabot
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'discordasistenciabot'
primary_region = 'gru'

[build]

# Este bot es un worker: no expone HTTP, se conecta a Discord por WebSocket y
# espera a las 08:29 / 18:00. No debe declarar [http_service]: con auto_stop
# Fly apagaba la maquina por falta de trafico HTTP y el bot dejaba de marcar.
# Sin servicios declarados, la maquina queda siempre encendida.

# Medido en produccion: el proceso .NET usa ~101 MB RSS en reposo. 256 MB
# (el tamano minimo de Fly) deja margen de sobra y es el nivel mas barato.
[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

[env]
  # Workstation GC con heaps chicos: el bot esta ocioso casi todo el dia,
  # asi que conviene devolver memoria al SO antes que optimizar throughput.
  DOTNET_gcServer = '0'
  DOTNET_GCConserveMemory = '5'
