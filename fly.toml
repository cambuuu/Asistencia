# fly.toml app configuration file for discordasistenciabot
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'discordasistenciabot'
primary_region = 'gru'

[build]

# Este bot es un worker: no expone HTTP, se conecta a Discord por WebSocket y
# espera a las 08:29 / 18:00. No debe declarar [http_service]: con auto_stop
# Fly apagaba la maquina por falta de trafico HTTP y el bot dejaba de marcar.
# Sin servicios declarados, la maquina queda siempre encendida.

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
